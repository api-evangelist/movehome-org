agent_card:
  name: MoveHome.org Property Agent
  description: >-
    Agent-to-agent access to the MoveHome.org property catalogue. Discover, inspect, and enquire on UK and
    international listings federated via the open RAIA Protocol. Read-only search and listing retrieval are
    anonymous; enquiries are forwarded to the source estate agent.
  url: https://movehome.org/api/a2a
  version: 0.1.0
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  provider:
    organization: Move Home Organisation CIC
    url: https://movehome.org
  documentation_url: https://movehome.org/skills.md
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json, text/plain]
  security_schemes: null
  security: null
  icon_url: null
  signatures: null
  skill_count: 3
  skills:
  - {id: search_properties, name: Search properties, tags: [property, search, real-estate, lettings, sales], write: false}
  - {id: get_property, name: Get property, tags: [property, detail, real-estate], write: false}
  - {id: create_enquiry, name: Create enquiry, tags: [property, enquiry, lead, transact, viewing], write: true, note: 'Records an enquiry and forwards it to the source estate agent — a real human receives it. Requires enquirer name, email and a message.'}
  skill_invocation: >-
    A2A messages are free-form, so MoveHome fixes one convention: message/send with a single DataPart
    {"skill": "<skill_id>", "params": {...}}. The reply is a terminal Task; the structured result is in
    result.artifacts[0].parts[0].data (artifact names search_results, property, enquiry_receipt) and the
    human summary in result.status.message.parts[0].text. Skill-level failures (bad params, unknown listing,
    unknown skill) come back as a Task with status.state "failed" over HTTP 200, not as a JSON-RPC error.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications and stateTransitionHistory all false. protocolVersion is present at the top level
    (pass), declared as "0.3.0". skills is an ARRAY (pass) of three fully-populated skills, each with id,
    name, description, tags and examples. All three optional discriminators are present: preferredTransport
    (JSONRPC), defaultInputModes and defaultOutputModes (application/json and text/plain). The card is
    produced by the @a2a-js/sdk 0.3.x server library, which the provider's package.json declares, and the
    live endpoint behaves as the card says (no streaming, no task persistence, JSON-RPC 2.0).
  deviations:
  - field: protocolVersion / url / preferredTransport
    observed: 0.3.0 top-level triple; no supportedInterfaces[] or additionalInterfaces[]
    note: >-
      Valid for A2A 0.3.0, which the card declares. A reader written against A2A 1.0.0 looks for
      supportedInterfaces[].protocolBinding and will not find it. Recorded because both card shapes coexist
      in the catalog, not as a fault.
  - field: securitySchemes / security
    observed: absent
    note: >-
      The card declares no authentication scheme, and none is needed: the provider's skills.md states
      "Auth: none (anonymous)" for every skill including create_enquiry. The only gate on the write skill is
      rate limiting and duplicate suppression, which the card does not express.
  - field: signatures
    observed: absent
    note: >-
      skills.md says the card "may carry a JWS signature (signatures[])" verifiable against
      /.well-known/jwks.json (ES256). The served card carries none and the JWKS is {"keys":[]}. The signing
      code exists in the provider's repository (src/lib/a2a/card-signing.ts) but is not active in
      production.
  - field: iconUrl
    observed: absent
    note: Optional. The provider serves brand assets at /branding/icon.png and /branding/icon.svg but does not reference them from the card.
  - field: skills[].inputModes / outputModes / security
    observed: absent on every skill
    note: Optional per-skill fields; the card relies on the defaults.
  - field: skills[].description vs live behaviour
    observed: search_properties describes bedrooms and maximum price filters; the live MCP inputSchema for the same skill omits bedrooms_max, features and offset, which skills.md documents for the A2A skill
    note: A divergence between the A2A skill (richer, per skills.md) and its MCP twin (narrower), not a card fault. See mcp/movehome-org-tool-crosswalk.yml.
surface_relationship:
  note: >-
    MoveHome publishes four machine surfaces on one host and they are projections of the same public
    listing mirror, not of one another. A2A: three skills at https://movehome.org/api/a2a (the only agent
    surface with the create_enquiry write). MCP: two read-only property tools at https://movehome.org/mcp
    and three registry tools at https://movehome.org/api/registry/mcp. REST: an unauthenticated A2A-registry
    API under /api/registry/v1 (no OpenAPI published) and an OAuth2-gated RAIA Portal Feed API under
    /api/raia/portal/v1 for CRMs pushing listings IN, whose contract is the RAIA Protocol's published
    OpenAPI 3.1.0 (see openapi/). MoveHome also runs a public registry OF real-estate A2A agents and lists
    its own card in it.
