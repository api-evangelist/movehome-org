  path: /.well-known/agent-card.json
  canonical: true
  host: movehome.org
  note: >-
    Served from the apex host, which is also the A2A JSON-RPC host (/api/a2a), the MCP host (/mcp) and the
    RAIA Portal Feed API host — one Vercel-hosted Next.js origin (region lhr1). The same 2,090-byte body is
    served byte-for-byte at the canonical /.well-known/agent-card.json, at the legacy /.well-known/agent.json
    (the provider's own docs call the legacy path primary and the canonical one an "alias"), at GET
    /api/a2a and at /api/agent-card. www.movehome.org serves the identical body without redirecting. This
    is not an SPA catch-all: every other /.well-known/* path returns a real 404 (the Next.js not-found page,
    7,664 bytes, text/html) and the card is application/json. Ownership is not in question — the card's
    provider.organization is "Move Home Organisation CIC" with provider.url https://movehome.org, the
    homepage footer carries the same company name and Companies House number 17202438, and the card is
    generated by src/lib/a2a/card.ts in the provider's own open-source repository
    (github.com/MoveHome/MoveHome.Org).
