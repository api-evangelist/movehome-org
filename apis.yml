- aid: movehome-org:movehome-a2a-registry-api
  name: MoveHome.org A2A Agent Registry API
  description: >-
    Public registry of real-estate A2A agents operated by MoveHome, exposed two ways. REST under https://movehome.org/api/registry/v1
    (no OpenAPI published; anonymous; JSON with RFC 9457 problem details on errors): GET /agents (q, location,
    service_type, category, skill, healthy, limit, offset), GET /agents/{idOrSlug}, GET /agents/{idOrSlug}/badge
    (SVG), GET /all, GET /stats, GET /healthz, POST /agents/register {wellKnownURI} (fetches and validates
    the card; 409 if already listed; 10/min), PUT /agents/{idOrSlug} (re-sync) and POST /agents/{idOrSlug}/flag
    (5/min). MCP at https://movehome.org/api/registry/mcp (protocol 2025-06-18, serverInfo movehome-a2a-registry
    1.0.0) with tools search_agents, get_agent and registry_stats. Two agents were listed on 2026-09-19,
    including MoveHome's own card.
  humanURL: https://movehome.org/registry
  baseURL: https://movehome.org/api/registry/v1
