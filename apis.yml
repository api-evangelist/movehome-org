apis:
- aid: movehome-org:movehome-a2a-property-agent
  name: MoveHome.org A2A Property Agent
  description: >-
    Agent2Agent (A2A 0.3.0) surface: an agent card served from https://movehome.org/.well-known/agent-card.json
    (and the legacy /.well-known/agent.json, byte-identical) declaring three skills — search_properties
    and get_property (read-only, anonymous) and create_enquiry (records an enquiry and forwards it to
    the source estate agent, a real human) — invoked by JSON-RPC 2.0 message/send at https://movehome.org/api/a2a
    with a single DataPart {skill, params}. Every call returns a terminal Task; skill failures are HTTP
    200 Tasks with status.state failed; streaming, push notifications and task persistence are declared
    unsupported (verified live: -32004 and -32001). Rate limited at 60/min per IP with X-RateLimit-* headers.
    Listings are RAIA Protocol cards keyed by raia_id and UN/LOCODE.
  humanURL: https://movehome.org/skills.md
  baseURL: https://movehome.org/api/a2a
  tags:
