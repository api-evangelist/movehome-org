aid: movehome-org
name: Move Home Organisation CIC
description: >-
  Move Home Organisation CIC (Companies House 17202438, incorporated 6 May 2026, Poole, England) is an
  asset-locked UK Community Interest Company that runs MoveHome.org, a free, not-for-profit property
  listing aggregator built as the open-source reference consumer of the RAIA Protocol — the Real Estate AI
  Agent standard whose charter names the same CIC as its governing body — with listings federated from
  estate agencies and the transaction side handled by the separate commercial company EstateAigents.com Ltd.
  Its machine surface is agent-native and anonymous: an A2A 0.3.0 agent card at
  /.well-known/agent-card.json (graded conformant) with search_properties, get_property and create_enquiry
  skills over JSON-RPC at https://movehome.org/api/a2a; a read-only MCP server at https://movehome.org/mcp
  and a second MCP server over its public registry of real-estate A2A agents; an unauthenticated registry
  REST API under /api/registry/v1; and, for CRMs pushing listings in, an OAuth2 client-credentials
  implementation of the RAIA Portal Feed API (OpenAPI 3.1.0, 13 operations, RFC 9457 problem details) at
  https://movehome.org/api/raia/portal/v1. The site publishes an llms.txt/skills.md for agents but no
  privacy policy, terms, status page, changelog, SDK or pricing page.
