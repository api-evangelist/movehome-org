- aid: movehome-org:movehome-property-mcp-server
  name: MoveHome.org Property MCP Server
  description: >-
    Remote Model Context Protocol server at https://movehome.org/mcp (alias /api/mcp): stateless Streamable
    HTTP, protocol version 2025-06-18, serverInfo movehome-property 1.0.0, anonymous. tools/list answers
    with two read-only tools carrying real inputSchemas — search_properties (UN/LOCODE, service type,
    property type, bedrooms, price, limit 1-50) and get_property (raia_id) — over the same public RAIA
    listing mirror the A2A agent reads; the create_enquiry write is deliberately not exposed ("Read-only",
    per the server's initialize instructions). A GET returns a JSON descriptor of the transport and tool
    names; batch requests are refused; rate limit 60/min per IP (429 with JSON-RPC -32000).
  humanURL: https://movehome.org/skills.md
  baseURL: https://movehome.org/mcp
  tags:
  - MCP
  - Agent-Native
  - Real Estate
  tags_raw:
  - MCP
