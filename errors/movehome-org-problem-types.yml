    - {code: -32004, meaning: 'Unsupported operation — message/stream requires streaming capability. Observed.'}
    - {code: -32603, meaning: 'Internal error; also the code the docs give for a rate-limit breach (HTTP 429 with Retry-After and X-RateLimit-*)'}
    skill_level: >-
      Bad params, listing not found, unknown skill and "No skill invocation found" are returned as an HTTP
      200 Task with status.state "failed" and the reason in status.message.parts[0].text — observed:
      "No public listing found for prop-gb-none-00000000." An agent must check status.state, not just the
      HTTP code or the presence of error.
