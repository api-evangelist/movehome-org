problem_types:
- status: 400
  type: https://movehome.org/errors/validation
  title: Validation failed
  source_operations: [upsertListing, deleteListing, getBranchPerformance, requestPremiumListingActivation, requestFeaturedPropertyActivation, 'POST /api/registry/v1/agents/register', 'POST /api/enquire']
  causes:
  - Listing payload failed schema validation (validation_errors[] names each field).
  - DELETE without a removal_reason; performance window missing from/to or wider than 28 days.
  - Registry registration body without a wellKnownURI URL; non-JSON body ("Request body must be JSON.").
  remediation: Fix the named fields and resend; the write is rejected before anything is stored.
- status: 401
  type: https://movehome.org/errors/unauthorized
  title: Unauthorized
  source_operations: [upsertListing, getListing, deleteListing, listBranchListings, getBranchPerformance, listBranchEnquiries, requestPremiumListingActivation, requestFeaturedPropertyActivation, 'POST /oauth/token']
  causes: [Missing Authorization Bearer header, expired or malformed HS256 token, wrong signature or alg, missing client_id/client_secret on the token endpoint.]
  remediation: Mint a new token at POST /oauth/token (1-hour TTL; cache it — the token endpoint is capped at 10/min).
- status: 403
  type: https://movehome.org/errors/forbidden
  title: Forbidden
  source_operations: [upsertListing, getListing, deleteListing, listBranchListings, getBranchPerformance, listBranchEnquiries, requestPremiumListingActivation, requestFeaturedPropertyActivation]
  causes: [Token lacks the required scope (feed.read, feed.write or products.write); credential not bound to the requested branch.]
  remediation: Request the scope when minting the token; scopes are intersected with what the credential allows.
- status: 404
  type: https://movehome.org/errors/not-found
  title: Not Found
  source_operations: [getListing, deleteListing, listBranchListings, getBranchPerformance, listBranchEnquiries, getPremiumListingActivation, getFeaturedPropertyActivation, 'GET /api/registry/v1/agents/{idOrSlug}', 'PUT /api/registry/v1/agents/{idOrSlug}', 'POST /api/registry/v1/agents/{idOrSlug}/flag']
  causes: [Listing reference not found or not owned by the credential; unknown branch; unknown activation; no listed agent with that id or slug.]
- status: 409
  type: https://movehome.org/errors/conflict
  title: Conflict
  source_operations: [upsertListing, 'POST /api/registry/v1/agents/register']
  causes:
  - Listing reference already exists under a different branch for the same agent.
  - 'Agent already registered — detail names the slug and says "Use PUT /api/registry/v1/agents/{id} to re-sync."'
- status: 429
  type: https://movehome.org/errors/rate-limit
  title: Too Many Requests
  source_operations: [upsertListing, getListing, deleteListing, listBranchListings, getBranchPerformance, listBranchEnquiries, requestPremiumListingActivation, requestFeaturedPropertyActivation, 'POST /oauth/token', 'POST /api/registry/v1/agents/register', 'PUT /api/registry/v1/agents/{idOrSlug}', 'POST /api/registry/v1/agents/{idOrSlug}/flag', 'POST /api/enquire']
  headers: [Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
  remediation: Back off for Retry-After seconds; the window is a fixed UTC minute. See rate-limits/movehome-org-rate-limits.yml.
- status: 500
  type: https://movehome.org/errors/server
  title: Internal Server Error
  source_operations: ['5XX on every Portal Feed operation', 'registry writes ("Could not register the agent.")']
- status: 202
  title: Accepted (asynchronous)
  note: Not an error, but part of the envelope contract — upsertListing and deleteListing may answer 202 with an AsyncAccepted body when the implementer processes asynchronously; MoveHome's docs describe only synchronous 200/201.
