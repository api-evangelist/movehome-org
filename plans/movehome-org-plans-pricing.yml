model: free to list and free to query; a success fee only when a transaction completes, charged on the sister platform
summary: >-
  MoveHome publishes no pricing page (/pricing 404) and no tiers. Every machine surface is free and
  anonymous — the A2A skills, both MCP servers, the registry API and the website search — and the Portal
  Feed API credentials are issued by the operator at no stated price. The only money statements are on the
  homepage and the GitHub README: "Free to list. A small success fee funds the platform only when a deal
  completes" and "The full transaction is completed at a flat £1/property rate. No hidden fees." The
  transaction itself (viewings, references, contracts, rent) is handled by the separate commercial company
  EstateAigents.com Ltd at estateaigents.com, so the £1 figure is quoted here as the provider states it, not
  as a MoveHome API price.
