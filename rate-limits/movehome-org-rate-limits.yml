limit_count: 9
summary: >-
  One Postgres-backed fixed-minute-window limiter (src/lib/portal/rate-limit.ts) serves every surface,
  keyed by (client, endpoint group, UTC minute), default 60 per minute, with per-route overrides. Anonymous
  surfaces are keyed by a hash of the client IP; the Portal Feed API by OAuth2 client_id. The signal is
  X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset on every response (observed live on the A2A
  endpoint) and Retry-After on 429. Exhaustion is HTTP 429 with a problem+json body (type
  https://movehome.org/errors/rate-limit) on REST, JSON-RPC -32000 on the MCP servers, and -32603 on A2A
  per the integrator guide. The limiter fails OPEN: if its store is unavailable the request is allowed.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset (unix seconds, start of the next UTC minute)
  retry_after: Retry-After (seconds, on 429 only)
  status_on_exhaustion: 429
