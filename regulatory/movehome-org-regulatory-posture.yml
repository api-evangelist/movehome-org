note: >-
  MoveHome publishes NO privacy policy, terms of service, cookie notice, accessibility statement,
  subprocessor list, DPA, data-subject-request channel, transparency report, SBOM or AI-transparency page
  on movehome.org — every conventional path returns the site's 404 and the homepage/about/registry pages
  link to none. That is a notable gap for a UK web portal (SIC 63120) that accepts enquirer names, emails
  and phone numbers through its A2A create_enquiry skill and website form and forwards them to third-party
  estate agents: the only data-handling statements found are a README line ("Read-only. Anonymous. No
  PII.", which describes the listing aggregation, not the enquiry pipeline) and the A2A guide's note that
  enquiries are SSRF-guarded and forwarded to HTTPS public hosts. The one AI-related disclosure is the
  homepage's plain statement that "AI agents are managing the full transaction" and that the transaction
  side is handled by a separate company (estateaigents.com); that is marketing copy, not a transparency
  statement, and is not recorded as a signal. An empty signals map is the measurement; no regime is
  inferred here — which regimes reach a UK CIC property portal is decided by the Kin Score regime map.
